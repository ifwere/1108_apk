plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aichoice.assistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.aichoice.assistant"
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // The app ships only Java/Kotlin code, which is ABI independent and runs on
        // ARMv8 (arm64-v8a) devices. The filter documents/enforces the target ABI
        // should native code ever be added.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so the CI artifact is directly installable.
            signingConfig signingConfigs.debug
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        abortOnError false
    }
}

// Keep Chinese string literals intact regardless of the build machine locale.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is stubbed in local JVM tests; use the real implementation.
    testImplementation 'org.json:json:20240303'
}
