name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: app-version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle | head -n1)
          if [ -z "$VERSION" ]; then
            echo "versionName not found in app/build.gradle" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Recent cmdline-tools (16.0+) no longer ship the legacy "tools"
          # package that setup-android installs by default, so it must not be
          # requested. platform-tools is all this step needs to provide; the
          # platform and build-tools are installed explicitly below.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install required SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      # Keeps the debug signing key stable across CI runs so a newly built APK can
      # be installed over a previous one (and app data is preserved).
      - name: Cache debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Assemble release APK
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      # Publish only builds from the main branch; pull requests and other
      # branches keep producing artifacts without creating a release.
      - name: Prepare release assets
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk \
             "dist/ai-choice-assistant-${{ steps.app-version.outputs.version }}-release.apk"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/ai-choice-assistant-${{ steps.app-version.outputs.version }}-debug.apk"

      - name: Create GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app-version.outputs.version }}-build.${{ github.run_number }}
          name: AI 选用助手 v${{ steps.app-version.outputs.version }} (build ${{ github.run_number }})
          body: |
            AI 选用助手自动构建产物。

            - 版本：${{ steps.app-version.outputs.version }}
            - 构建号：${{ github.run_number }}
            - 提交：${{ github.sha }}

            Release 与 Debug APK 均可直接安装（当前均使用 debug 签名）。
          files: dist/*.apk
          make_latest: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-choice-assistant-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: ai-choice-assistant-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
          retention-days: 7
